name: GIZA PRIME spatial tools

on:
  push:
    branches:
      - research/universe-3-semantic-atlas-001
    paths:
      - ".github/workflows/giza-spatial-tests.yml"
      - "tools/giza_spatial/**"
      - "tests/giza_spatial/**"
      - "requirements-giza-signal.txt"
      - "schemas/giza_spatial_evidence.schema.json"
      - "schemas/giza_ambient_vibration_manifest.schema.json"
      - "examples/giza_spatial/**"
  pull_request:
    branches:
      - research/universe-3-semantic-atlas-001
    paths:
      - ".github/workflows/giza-spatial-tests.yml"
      - "tools/giza_spatial/**"
      - "tests/giza_spatial/**"
      - "requirements-giza-signal.txt"
      - "schemas/giza_spatial_evidence.schema.json"
      - "schemas/giza_ambient_vibration_manifest.schema.json"
      - "examples/giza_spatial/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coordinate-transform-and-vibration-intake-tests:
    name: GIZA spatial tools / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install signal processing dependency
        run: python -m pip install -r requirements-giza-signal.txt

      - name: Run GIZA spatial tools tests
        run: python -m unittest discover -s tests/giza_spatial -v
