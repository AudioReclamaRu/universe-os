name: GIZA PRIME spatial tools

on:
  push:
    branches:
      - research/universe-3-semantic-atlas-001
  pull_request:
    branches:
      - research/universe-3-semantic-atlas-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coordinate-transform-tests:
    name: Coordinate transform unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests/giza_spatial -v
